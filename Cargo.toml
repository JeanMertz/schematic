[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
chrono = "0.4"
convert_case = "0.11"
indexmap = "2"
miette = "7"
regex = "1"
relative-path = "2"
reqwest = { version = "0.13", default-features = false }
ron = "0.12"
rpkl = "0.7"
rust_decimal = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
starbase_sandbox = "0.10"
toml = "1"
tracing = "0.1"
url = "2"
uuid = "1"
